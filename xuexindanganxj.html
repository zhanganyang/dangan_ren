      </div>

            style="display: block"

          ></a>

      </div>
      <div class="padding16 xj-index chsi-font">
        <div class="jd-res-div" style="margin-bottom: 0.533rem">
          <div class="flex-box">
            <div class="flex1">
              <span class="scan-txewm"></span>查看图像采集码

          <div class="sanjiao"><em></em><span></span></div>

        <!---->

        <div class="top-card">
          <div class="van-row">
            <div class="van-col van-col--9">
              <div class="flex-box">
                <div class="flex1">
                  <div class="img-div">
                    <img src="" class="full-img" id="xj-photo" />

                    <img

                    />

                </div>

              <h5 class="nameFamily" id="xj-name"></h5>

          </div>
          <div class="top-bottom-img xj-detail-img">
            <div class="yxmc-wrap">
              <div class="yxmc" id="xj-school"></div>
              <div class="cc xj-cc-lable" id="xj-degree"></div>

            <div class="des" id="xj-description"></div>

      <!---->
      <!---->

    </div>
    <script src="./data/loader.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var id = params.get("id");

        if (!id) {
          window.location.href = "./index.html";
          return;
        }

        function renderData(data) {
          document.getElementById("xj-photo").src = data.photo;
          document.getElementById("xj-name").textContent = data.name;
          document.getElementById("xj-profile").textContent =
            data.gender + "\u3000" + data.birthday;
          document.getElementById("xj-school").textContent = data.school;
          document.getElementById("xj-degree").textContent = data.degree;
          document.getElementById("xj-description").textContent =
            data.description;

          document.getElementById("xj-details").innerHTML = data.details
            .map(function (item) {
              return (
                "<li><div class=\"left\">" +
                item.label +
                "</div><div class=\"right\">" +
                item.value +
                "</div></li>"
              );
            })
            .join("");
        }

        window.loadXjData(id).then(renderData).catch(console.error);
      })();
    </script>
  </body>
